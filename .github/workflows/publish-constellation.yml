name: Publish Constellation image

# Run from the Actions tab: "Publish Constellation image" -> "Run workflow".
# Builds for Intel/AMD and Raspberry Pi (arm64) and pushes to ghcr.io.
# The run summary prints the exact image line to pin in docker-compose.yml.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag, normally the version in umbrel-app.yml"
        required: true
        default: "0.1.0"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the owner (registry names must be lowercase)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./constellation-src/app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER }}/constellation:${{ inputs.version }}

      - name: Show the image line to use
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "ghcr.io/${OWNER}/constellation:${{ inputs.version }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Pin that in patriot-constellation/docker-compose.yml, then make the package public: GitHub profile -> Packages -> constellation -> Package settings -> Change visibility -> Public."
          } >> "$GITHUB_STEP_SUMMARY"
