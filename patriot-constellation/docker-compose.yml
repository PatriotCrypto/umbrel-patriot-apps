version: "3.7"

services:
  server:
    image: ghcr.io/patriotcrypto/constellation:0.2.2@sha256:32713b755dce847eb61c2c65aa7df412a67ef9fdc5e18f00298cd614cac3b1ac
    restart: on-failure
    stop_grace_period: 1m
    # Host network so ARP and name lookups can see the real LAN. No app_proxy in front,
    # so the app protects itself with its own password.
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    # The app runs as root inside the container only to write its data folder.
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: "3977"
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
