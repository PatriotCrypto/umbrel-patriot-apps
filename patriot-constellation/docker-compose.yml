version: "3.7"

services:
  server:
    image: ghcr.io/patriotcrypto/constellation:0.2.3@sha256:768732464a6e6667f5bfd8569b3b78b4fe956932ce37357bb7c42f71543ad9b5
    restart: on-failure
    stop_grace_period: 1m
    # Host network so ARP and name lookups can see the real LAN. No app_proxy in front,
    # so the app protects itself with its own password.
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    # The app runs as root inside the container only to write its data folder.
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: "3977"
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
