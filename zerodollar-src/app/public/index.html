<!doctype html>
<html lang="en" data-theme="daylight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<meta name="color-scheme" content="light dark">
<title>ZeroDollar</title>
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="/css/app.css">
<script>
  // Apply the saved look before first paint so there is no flash.
  try { var t = localStorage.getItem('zd.theme'); if (t === 'daylight' || t === 'midnight') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div id="app"><div class="boot">ZeroDollar</div></div>
<div id="layer"></div>
<noscript>ZeroDollar needs JavaScript.</noscript>
<script type="module" src="/js/app.js"></script>
</body>
</html>
