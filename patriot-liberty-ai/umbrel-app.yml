id: patriot-liberty-ai
category: ai
name: Liberty AI
version: "0.3.0"
tagline: The Liberty Drive for your Umbrel: offline AI and library
description: >-
  Liberty AI is the Liberty Drive for your Umbrel: an offline AI assistant plus your own reference library.
  A starter library is built in (founding documents, the KJV Bible, survival, medical, food and homestead, radio, energy, finance, faith and history). Add your own manuals and family papers from folders on your Umbrel, and connect Kiwix for Wikipedia-sized reference, then ask questions in plain English. Answers cite the exact passages they came from, so you can
  check every claim. Instant search works even without the AI.


  It is read-only and permission-first. It can only read folders you add and apps you switch on, all off by
  default, and it never changes anything. Use a small local model through Ollama and nothing leaves your Umbrel,
  or bring your own Claude key for harder questions, with a separate "may go to the cloud" switch for each kind of
  data and a Local-only mode that blocks the cloud entirely. An optional Server page can watch disk, memory and
  apps for you.


  Works with the Patriot Apps (Rally Point, ZeroDollar, Cold Front and more as they join in). Freedom doesn't
  need Wi-Fi.


  Needs read access to your Umbrel storage for the folders you pick (and to Docker for the optional Server page).
  Independent project. Not affiliated with or endorsed by Anthropic, Ollama or Umbrel.
