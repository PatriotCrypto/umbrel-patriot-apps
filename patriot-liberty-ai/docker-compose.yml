version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: patriot-liberty-ai_web_1
      APP_PORT: 3979

  web:
    image: ghcr.io/patriotcrypto/liberty-ai:0.4.0@sha256:546056869bd0c50b005592a3b159b4be3b8f372f52ba2887a1e4acb5d7bb1b1a
    restart: on-failure
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    # Root inside the container is needed to read the Docker socket; DAC_OVERRIDE lets it do that.
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: "3979"
      DATA_DIR: /data
      STORAGE_DIR: /files
      PROXY_HOST: patriot-liberty-ai_app_proxy_1
    volumes:
      - ${APP_DATA_DIR}/data:/data
      # Read-only: Liberty AI can only look at folders you add. Home is your Umbrel Files app
      # (Documents, Downloads and so on). Storage is where apps keep their files.
      - ${UMBREL_ROOT}/home:/files/Home:ro
      - ${UMBREL_ROOT}/data/storage:/files/Storage:ro
      # Read-only socket, used for GET requests only (container list, logs, stats).
      - /var/run/docker.sock:/var/run/docker.sock:ro
