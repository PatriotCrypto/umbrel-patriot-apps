version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: patriot-zerodollar_web_1
      APP_PORT: 3973
  web:
    image: ghcr.io/patriotcrypto/zerodollar:0.2.0@sha256:e9d75a57b6f52ad6459b4c27a2658673131d6dac3c87c07afa5ffb4a09987b56
    restart: on-failure
    stop_grace_period: 15s
    environment:
      DATA_DIR: /data
      PORT: 3973
    volumes:
      - ${APP_DATA_DIR}/data:/data
