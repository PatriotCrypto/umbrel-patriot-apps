version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: patriot-zerodollar_web_1
      APP_PORT: 3973
  web:
    image: ghcr.io/patriotcrypto/zerodollar:0.3.0@sha256:bf21947ff71009d2f68b0672fa3a1a2b1a68571be55d12e8e686f2323661fa2b
    restart: on-failure
    stop_grace_period: 15s
    environment:
      DATA_DIR: /data
      PORT: 3973
    volumes:
      - ${APP_DATA_DIR}/data:/data
