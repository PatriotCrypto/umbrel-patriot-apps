version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: patriot-zerodollar_web_1
      APP_PORT: 3973
  web:
    image: ghcr.io/patriotcrypto/zerodollar:0.3.2@sha256:fe4cc4a2cffd411918b866a21f4127edf5b238d79a3dee7f9136e53dc7da596c
    restart: on-failure
    stop_grace_period: 15s
    environment:
      DATA_DIR: /data
      PORT: 3973
    volumes:
      - ${APP_DATA_DIR}/data:/data
