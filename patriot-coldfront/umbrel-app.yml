manifestVersion: 1
id: patriot-coldfront
category: automation
name: Cold Front
version: "0.3.2"
tagline: Local thermostat control, schedules and insights
description: >-
  Cold Front takes over a Z-Wave thermostat (built for the Honeywell T6 Pro Z-Wave) with no cloud and no accounts.
  Set your own weekly schedule, hold or away settings, safety limits, and see runtime, short-cycling and wall-change insights.
  Add Z-Wave temperature and humidity sensors for other rooms and Cold Front tracks them too, with an optional room-aware mode.


  Needs a Z-Wave USB stick (800 series recommended). The thermostat keeps its own schedule as a fallback if Umbrel is off.
  Starts in Demo mode so you can try it before the hardware arrives.


  Not affiliated with or endorsed by Honeywell, Zooz, the Z-Wave Alliance or Umbrel.
developer: Patriot
website: https://github.com/PatriotCrypto/umbrel-patriot-apps
repo: https://github.com/PatriotCrypto/umbrel-patriot-apps
support: https://github.com/PatriotCrypto/umbrel-patriot-apps/issues
port: 3971
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: "Fixes Insights so room temperature and humidity are recorded before a thermostat is paired, and the home-screen status widget now shows your room sensor until the thermostat is added."
submitter: Patriot
submission: https://github.com/PatriotCrypto/umbrel-patriot-apps
icon: https://raw.githubusercontent.com/PatriotCrypto/umbrel-patriot-apps/main/patriot-coldfront/icon.svg
widgets:
  - id: "status"
    type: "four-stats"
    refresh: "30s"
    endpoint: "web:3971/api/widget/status"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Indoor"
          text: "69.5"
          subtext: "°F"
        - title: "Target"
          text: "68-76"
          subtext: "°F"
        - title: "Status"
          text: "Idle"
          subtext: "auto"
        - title: "Humidity"
          text: "38"
          subtext: "%"

  - id: "filter"
    type: "text-with-progress"
    refresh: "60s"
    endpoint: "web:3971/api/widget/filter"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "Furnace filter"
      text: "49 days"
      subtext: "/ 90 days"
      progressLabel: "41 days left"
      progress: 0.54
