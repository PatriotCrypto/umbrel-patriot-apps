tagline: Write songs, find the right word, track every release
icon: https://raw.githubusercontent.com/PatriotCrypto/umbrel-patriot-apps/main/patriot-studio-notebook/icon.svg
description: >-
  Studio Notebook is a private songwriter's notebook that lives on your Umbrel.


  Every song gets a lyric sheet that counts the syllables in each line, colours the words that rhyme, and warns you when the lyrics run past a character limit you set. Beside the sheet is a full set of word tools that work with no internet: perfect, close and wide rhymes, multi-syllable rhymes, rhyming phrases, word families, meanings with synonyms and opposites, a phrase dictionary, alliteration, figures of speech and a searchable King James Bible.


  Keep the story behind each song, production notes, cover art and audio takes with the lyrics. Earlier drafts are kept automatically so you can compare them or go back. A release checklist, release date and links follow each song from first idea to release day, and an ideas page catches lines, hooks and titles before they get away.


  A release calendar shows what is scheduled and suggests a date for your next release. If you add your Spotify and Apple Music artist links, a Sync button finds your songs there, marks the ones that are live and fills in links, dates and cover art.


  Four looks, and one hidden surprise. Your writing stays on your Umbrel. The app only goes online when you press Sync. No accounts, no subscription, no telemetry.


  Studio Notebook is an independent hobby project. It is not affiliated with or endorsed by MasterWriter, Suno, DistroKid, Spotify, Apple or Umbrel.
