releaseNotes: >-
  Rhyme colours now catch far more: long words that share an ending (particular, molecular, muscular) and near rhymes are grouped, and a word repeating itself no longer counts as a rhyme. The status filter buttons on the Songs page are fixed. New: a Pre-Chorus button, your five most used words on the Desk, a release Calendar with a suggested next release date, and a Sync button that finds your songs on Spotify and Apple Music once you add your artist links in Settings.
