version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: patriot-studio-notebook_web_1
      APP_PORT: 3983

  web:
    image: ghcr.io/patriotcrypto/studio-notebook:0.2.2@sha256:c1cd132ee82195a723a734c1eaaf4fa60b73a71e4fb53f5110fcf6db5cd44926
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: 3983
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
