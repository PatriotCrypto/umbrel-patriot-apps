version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: patriot-studio-notebook_web_1
      APP_PORT: 3983

  web:
    image: ghcr.io/patriotcrypto/studio-notebook:0.2.3@sha256:d139ed2de10982c05ec2061ca04855383d6e418bf584d9f677ad9e0f407e4672
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: 3983
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
