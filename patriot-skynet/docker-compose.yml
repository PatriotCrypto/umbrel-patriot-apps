version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: patriot-skynet_web_1
      APP_PORT: 3959

  web:
    # After pushing the image, replace the tag with the pinned digest:
    #   ghcr.io/patriotcrypto/skynet:0.1.6@sha256:<manifest-list digest>
    image: ghcr.io/patriotcrypto/skynet:0.1.6@sha256:65d58d61c7fbc3107d5b3a545ff0e0337af82b3118175d50732b02fea9612c97
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      PORT: 3959
      DATA_DIR: /data
