version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: patriot-skynet_web_1
      APP_PORT: 3959

  web:
    # After pushing the image, replace the tag with the pinned digest:
    #   ghcr.io/patriotcrypto/skynet:0.2.0@sha256:<manifest-list digest>
    image: ghcr.io/patriotcrypto/skynet:0.2.1@sha256:b917a39f44a39cba93b81bb25941e90e782eeb19c0537ada1f02ac4710dffc1e
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      PORT: 3959
      DATA_DIR: /data
