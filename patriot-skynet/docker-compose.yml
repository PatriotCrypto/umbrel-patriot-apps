version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: patriot-skynet_web_1
      APP_PORT: 3959

  web:
    # After pushing the image, replace the tag with the pinned digest:
    #   ghcr.io/patriotcrypto/skynet:0.2.0@sha256:<manifest-list digest>
    image: ghcr.io/patriotcrypto/skynet:0.2.2@sha256:fe2b23546fa2551173f2f20c1b352b38f3ab368a7688ea7bf891b44707c38d62
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      PORT: 3959
      DATA_DIR: /data
