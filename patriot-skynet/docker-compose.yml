version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: patriot-skynet_web_1
      APP_PORT: 3959

  web:
    # After pushing the image, replace the tag with the pinned digest:
    #   ghcr.io/patriotcrypto/skynet:0.1.7@sha256:<manifest-list digest>
    image: ghcr.io/patriotcrypto/skynet:0.1.7@sha256:4e79cc1bd535185e809cddafdaa87d1e9eaac87a018eb246a638d857d8823487
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      PORT: 3959
      DATA_DIR: /data
