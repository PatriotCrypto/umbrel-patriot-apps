version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: patriot-skynet_web_1
      APP_PORT: 3959

  web:
    # After pushing the image, replace the tag with the pinned digest:
    #   ghcr.io/patriotcrypto/skynet:0.2.0@sha256:<manifest-list digest>
    image: ghcr.io/patriotcrypto/skynet:0.2.0@sha256:ca34352216d98c0a72a0e5621046f7a98b583ff13ba7d0596b121d34dbb37d83
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      PORT: 3959
      DATA_DIR: /data
