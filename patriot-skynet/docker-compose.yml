version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: patriot-skynet_web_1
      APP_PORT: 3959

  web:
    # After pushing the image, replace the tag with the pinned digest:
    #   ghcr.io/patriotcrypto/skynet:0.1.9@sha256:<manifest-list digest>
    image: ghcr.io/patriotcrypto/skynet:0.1.9@sha256:ec587f42d91a9237d95f8b40e2978c86ab7ae5d2707043965ef9c1a38a924d08
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      PORT: 3959
      DATA_DIR: /data
