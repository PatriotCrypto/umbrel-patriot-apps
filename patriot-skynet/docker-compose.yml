version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: patriot-skynet_web_1
      APP_PORT: 3959

  web:
    # After pushing the image, replace the tag with the pinned digest:
    #   ghcr.io/patriotcrypto/skynet:0.1.8@sha256:<manifest-list digest>
    image: ghcr.io/patriotcrypto/skynet:0.1.8@sha256:7d10b410525d06519dc94964f91f2a81211d82bc36b45d7c32b4a6eff122e88a
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      PORT: 3959
      DATA_DIR: /data
