version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: patriot-disc-ripper_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/patriotcrypto/disc-ripper:0.4.1@sha256:80da0178a480678a7ca2a9bb8a72ee906bb49931b5d96f783c8e5d0da3ddfc75
    restart: on-failure
    stop_grace_period: 1m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SYS_RAWIO
    security_opt:
      - no-new-privileges:true
    # Only optical drives (block major 11) and SCSI generic nodes (char major 21) may be opened.
    device_cgroup_rules:
      - "b 11:* rwm"
      - "c 21:* rwm"
    environment:
      PORT: 3000
      DATA_DIR: /data
      MEDIA_DIR: /media
      DOWNLOADS_DIR: /downloads
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
      - /dev:/dev
